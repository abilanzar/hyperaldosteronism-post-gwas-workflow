name: synthetic-post-gwas-demo

on:
  push:
  pull_request:

jobs:
  run-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run workflow and tests
        run: bash scripts/run_demo.sh
